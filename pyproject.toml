[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-pipeline"
version = "0.1.0"
description = "Efficient CSV → Postgres (1M+ rows) via n8n"
requires-python = ">=3.9"
dependencies = [
    "fastapi",
    "httpx",
    "polars",
    "psycopg[binary]",
    "python-multipart",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.setuptools.packages.find]
include = ["api*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
